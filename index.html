<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Theme before paint: next-themes only runs after React mounts, so without this the page can
      flash light. Logic must match ColorModeProvider (storageKey "theme", default "system", class on <html>).
    -->
    <script>
      (function () {
        var storageKey = "theme";
        var defaultTheme = "system";
        var themes = ["light", "dark"];
        var root = document.documentElement;
        function systemPref() {
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        try {
          var stored = localStorage.getItem(storageKey) || defaultTheme;
          var resolved = stored === "system" ? systemPref() : stored;
          if (themes.indexOf(resolved) < 0) resolved = systemPref();
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          var fb = systemPref();
          root.classList.remove("light", "dark");
          root.classList.add(fb);
          root.style.colorScheme = fb;
        }
      })();
    </script>
    <!-- Chakra semantic bg: white / black (tokens) — bridges gap until JS bundle applies theme. -->
    <style>
      html.light,
      html.light body {
        background-color: #ffffff;
      }
      html.dark,
      html.dark body {
        background-color: #09090b;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Canonical / Open Graph URL: replaced at build (VITE_SITE_URL from GitHub Actions configure-pages). -->
    <title>Emotion Wheel — interactive tool for emotional literacy</title>
    <meta
      name="description"
      content="Interactive emotion wheel: explore core moods down to specific feeling words. A free digital tool in the spirit of resources therapists use to grow emotional vocabulary, literacy, and intelligence."
    />
    <meta
      name="keywords"
      content="emotion wheel, emotional literacy, emotional intelligence, feelings, emotions, therapy tools, vocabulary, self-awareness"
    />
    <link rel="canonical" href="__SITE_URL__" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Emotion Wheel — interactive tool for emotional literacy"
    />
    <meta
      property="og:description"
      content="Interactive emotion wheel: explore core moods down to specific feeling words. A free digital tool in the spirit of resources therapists use to grow emotional vocabulary, literacy, and intelligence."
    />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Emotion Wheel" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Emotion Wheel — interactive tool for emotional literacy"
    />
    <meta
      name="twitter:description"
      content="Interactive emotion wheel: explore core moods down to specific feeling words. A free digital tool in the spirit of resources therapists use to grow emotional vocabulary, literacy, and intelligence."
    />

    <meta name="robots" content="index, follow" />

    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Emotion Wheel",
        "description": "Interactive emotion wheel for exploring feelings from broad moods to specific labels—supporting emotional literacy and vocabulary, in line with tools used in therapeutic and educational settings.",
        "url": "__SITE_URL__",
        "applicationCategory": "EducationalApplication",

        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
